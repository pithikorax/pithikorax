<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Píthikórax</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Unna:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Resetando margens e padding */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #0a0a0a;
            color: #e1e1e1;
            line-height: 1.6;
        }
        header {
            background-color: #1c1c1c;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #bb8800;
            animation: fadeIn 2s ease-out;
        }
        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: #bb8800;
            animation: fadeIn 3s ease-out;
        }
        nav {
            margin-top: 15px;
        }
        nav a {
            color: #e1e1e1;
            text-decoration: none;
            margin: 0 20px;
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }
        nav a:hover {
            color: #bb8800;
        }
        /* Hero Section */
        .hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: url('https://via.placeholder.com/1500x800'); /* Adicione sua imagem de fundo */
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) contrast(120%) brightness(80%);
            animation: fadeIn 3s ease-out;
        }
        .hero h2 {
            font-family: 'Unna', serif;
            font-size: 2.5rem;
            color: #bb8800;
            margin-bottom: 20px;
            animation: fadeIn 4s ease-out;
        }
        .hero p {
            font-size: 1.5rem;
            max-width: 600px;
            margin: 0 auto;
            color: #d3d3d3;
            animation: fadeIn 5s ease-out;
        }
        .hero button {
            margin-top: 30px;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            background-color: #bb8800;
            color: #1a1a1a;
            cursor: pointer;
            border-radius: 10px;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            transition: background-color 0.3s ease;
        }
        .hero button:hover {
            background-color: #8a6e00;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }
            nav a {
                font-size: 1rem;
                margin: 0 10px;
            }
            .hero h2 {
                font-size: 1.8rem;
            }
            .hero p {
                font-size: 1.2rem;
            }
            .hero button {
                padding: 12px 24px;
                font-size: 1rem;
            }
        }

        /* Efeito de transição de fade */
        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        footer {
            background-color: #1c1c1c;
            color: #e1e1e1;
            text-align: center;
            padding: 10px;
            font-size: 1rem;
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Píthikórax</h1>
        <nav>
            <a href="#universo">Universo</a>
            <a href="#blog">Blog</a>
            <a href="#galeria">Galeria</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <section class="hero">
        <div>
            <h2>Entre o voo do corvo e o riso do macaco</h2>
            <p>Descubra um mundo onde filosofia, humor e mistério se encontram em perfeita harmonia.</p>
            <button>Explore Agora</button>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Píthikórax. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
